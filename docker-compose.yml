services:
  # ─────────────────────────────
  #  Base de datos PostgreSQL
  # ─────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: mjvc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mjvc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mjvc_pass}
      POSTGRES_DB: ${POSTGRES_DB:-mjvc_attendance}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mjvc_user} -d ${POSTGRES_DB:-mjvc_attendance}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mjvc_net

  # ─────────────────────────────
  #  Migraciones + Seed (run-once)
  # ─────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps         # sólo necesitamos node_modules + prisma
    container_name: mjvc_migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mjvc_user}:${POSTGRES_PASSWORD:-mjvc_pass}@db:5432/${POSTGRES_DB:-mjvc_attendance}
    command: >
      sh -c "
        npx prisma db push &&
        npx tsx prisma/seed.ts
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mjvc_net

  # ─────────────────────────────
  #  Aplicación Next.js
  # ─────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-mjvc_user}:${POSTGRES_PASSWORD:-mjvc_pass}@db:5432/${POSTGRES_DB:-mjvc_attendance}
    container_name: mjvc_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mjvc_user}:${POSTGRES_PASSWORD:-mjvc_pass}@db:5432/${POSTGRES_DB:-mjvc_attendance}
      JWT_SECRET: ${JWT_SECRET:-mjvc_ea_jesus_super_secure_jwt_secret_key_2026}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-MJVC EA's Jesús}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - mjvc_net

volumes:
  pg_data:

networks:
  mjvc_net:
    driver: bridge
